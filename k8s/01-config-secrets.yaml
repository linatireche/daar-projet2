apiVersion: v1
kind: ConfigMap
metadata:
  name: daar-config
  namespace: daar-library
data:
  TARGET_BOOK_COUNT: "1665"
  MIN_WORD_COUNT: "10000"
  DATA_DIR: "/app/data"
  DATABASE_HOST: "postgres-service"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "daar_library"
---
apiVersion: v1
kind: Secret
metadata:
  name: daar-secrets
  namespace: daar-library
type: Opaque
stringData:
  POSTGRES_USER: "daar_user"
  POSTGRES_PASSWORD: "daar_password"
  POSTGRES_DB: "daar_library"
  DATABASE_URL: "postgresql+psycopg2://daar_user:daar_password@postgres-service:5432/daar_library"
