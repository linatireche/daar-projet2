apiVersion: apps/v1
kind: Deployment
metadata:
  name: daar-frontend-deployment
  namespace: daar-library
  labels:
    app: daar-frontend
    tier: ui
spec:
  # 2 répliques maintenues par le ReplicaSet
  replicas: 2
  selector:
    matchLabels:
      app: daar-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: daar-frontend
        tier: ui
    spec:
      containers:
        - name: frontend
          image: projet2daar-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: daar-library
  labels:
    app: daar-frontend
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
  selector:
    app: daar-frontend
